<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Advice generator app</title>
  </head>
  <body>
    <main>
      <div class="advice-card">
        <p class="advice-id">Advice #</p>
        <p class="advice-text"></p>
        <picture class="divider">
          <source media="(min-width: 768px)" srcset="./images/pattern-divider-desktop.svg" />
          <img src="./images/pattern-divider-mobile.svg" 
          alt="divider" 
          class="img-divider"/>
        </picture>
        <button class="button-dice">
          <img src="./images/icon-dice.svg" alt="dice" class="img-dice"/>
        </button>
      </div>
    </main>
  </body>
</html>
